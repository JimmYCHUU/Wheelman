<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Wheelman</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <div class="app" id="app" data-view="list">
    <aside class="side" id="side" aria-label="Conversations"></aside>
    <main class="chat" id="chat" aria-live="off"></main>
    <aside class="info" id="info" aria-label="Customer and car details" hidden></aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
