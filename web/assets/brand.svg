<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The Wheelman mark: a white steering wheel on a disc in the brand colour. Placed on the page
       with <use href="assets/brand.svg#mark">; the disc takes the current colour, so it follows the
       light and dark themes. -->
  <symbol id="mark" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="24" fill="currentColor"/>
    <circle cx="24" cy="24" r="13.5" fill="none" stroke="#fff" stroke-width="4.5"/>
    <path d="M11.2 21.2h25.6M24 27.5V37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="24" cy="24.6" r="4.6" fill="#fff"/>
  </symbol>
</svg>
